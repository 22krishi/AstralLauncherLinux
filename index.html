<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Astral Legacy Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <!-- Skinview3D könyvtár a 3D skin és köpeny megjelenítéséhez -->
    <script src="https://unpkg.com/skinview3d@3.x/bundles/skinview3d.bundle.js"></script>
    <style>
        :root {
            --bg-base: #07090e;
            --sidebar-bg: #111111;
            --bg-surface: rgba(13, 17, 26, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-color-hover: rgba(255, 188, 0, 0.3);
            --accent: #ffbc00;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-base);
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Egyedi ablakkezelő sáv (Electron) */
        .titlebar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 35px;
            -webkit-app-region: drag;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }

        .window-controls {
            -webkit-app-region: no-drag;
            display: flex;
            gap: 4px;
        }

        .win-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 26px;
            height: 26px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .win-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .win-btn.close:hover {
            background: #ef4444;
            color: white;
        }

        .main-container {
            display: flex;
            flex-grow: 1;
            position: relative;
            z-index: 5;
            height: 100%;
        }

        /* Bejelentkezési képernyő */
        #login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: #0f1117;
            animation: fadeIn 0.4s ease-out;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .auth-box {
            background: #161b22;
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 12px;
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .auth-box input[type="text"],
        .auth-box input[type="password"] {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .auth-box input:focus {
            border-color: var(--accent);
        }

        .remember-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-container input {
            cursor: pointer;
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .main-action-btn {
            background: var(--accent);
            border: none;
            color: #0b0f19;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .main-action-btn:hover {
            filter: brightness(1.1);
        }

        /* Launcher Főfelület */
        #launch-section {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Bal oldali sáv */
        .sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 220px;
            height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 45px 12px 15px 12px;
            z-index: 10;
        }

        .sidebar-top {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .user-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-md);
            margin-bottom: 12px;
        }

        .user-profile-left {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .user-identity-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            overflow: hidden;
        }

        .user-head-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: var(--radius-sm);
            image-rendering: pixelated;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
        }

        .user-rank-img {
            height: 24px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
            margin-top: 2px;
            display: block;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            color: var(--text-muted);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
        }

        .menu-item i {
            font-size: 18px;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
        }

        .menu-item.active {
            background: rgba(255, 188, 0, 0.1);
            color: var(--accent);
        }

        /* Launcher Fő tartalom */
        .launcher-content {
            margin-left: 220px;
            width: calc(100% - 220px);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            background: url('https://r2.fivemanage.com/oFeVrg92lBoQTTdEqPPEm/astralgame.png') no-repeat center center;
            background-size: cover;
        }

        .launcher-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        .page-view {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            animation: fadeIn 0.3s ease-out;
        }
        .page-view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .home-inner {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 25px 20px 30px 20px;
        }

        .game-logo-img {
            position: absolute;
            top: 20%;
            max-width: 380px;
            height: 175px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.8));
            animation: floatLogo 4s ease-in-out infinite alternate;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        .play-section {
            position: absolute;
            bottom: 40px;
            width: 500px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .play-subtitle {
            font-size: 12px;
            color: #e5e7eb;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .play-btn {
            width: 100%;
            background: linear-gradient(to bottom, #22c55e, #15803d);
            border: 1px solid #16a34a;
            color: white;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
        }

        .play-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .status-text {
            font-size: 12px;
            color: #ef4444;
            min-height: 15px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        .content-card-view {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .panel-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 400px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .setting-label span {
            color: var(--accent);
            font-weight: 600;
        }

        .ram-slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ram-slider-container input[type="range"] {
            flex-grow: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }

        /* --- KÉTOSZLOPOS MODOK MENÜ --- */
        .mods-panel-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: var(--radius-lg);
            width: 620px;
            max-width: 95%;
            height: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .mods-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            overflow-y: auto;
            padding-right: 6px;
            width: 100%;
            flex-grow: 1;
        }

        .mods-grid::-webkit-scrollbar {
            width: 6px;
        }
        .mods-grid::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        .mods-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            transition: background 0.2s;
        }
        .mods-grid::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        .mod-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
            height: 95px;
        }

        .mod-card:hover {
            border-color: var(--border-color-hover);
            background: rgba(255, 255, 255, 0.04);
        }

        .mod-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .mod-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .mod-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
            overflow: hidden;
        }

        .mods-search-container input {
            width: 100%;
            background: rgba(8, 11, 16, 0.6);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .mods-search-container input:focus {
            border-color: var(--accent);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(16px); }
    </style>
</head>
<body>

    <div class="titlebar">
        <div class="window-controls">
            <button class="win-btn" onclick="minimizeWindow()"><i class="ti ti-minus"></i></button>
            <button class="win-btn close" onclick="closeWindow()"><i class="ti ti-x"></i></button>
        </div>
    </div>

    <div class="main-container">
        <!-- 1. BEJELENTKEZÉSI NÉZET -->
        <div id="login-section">
            <div class="logo-container">
                <img src="https://center.astrallegacy.hu/center/ranks/logo.png" alt="Astral Legacy Logo" style="width: 140px; height: auto; margin-bottom: 10px;">
                <div style="font-size: 13px; color: var(--text-muted);">Jelentkezz be a folytatáshoz</div>
            </div>

            <div class="auth-box">
                <input type="text" id="username" placeholder="Felhasználónév" />
                <input type="password" id="password" placeholder="Jelszó" />
                
                <label class="remember-container">
                    <input type="checkbox" id="remember-user" />
                    Felhasználó megjegyzése
                </label>

                <button class="main-action-btn" onclick="handleLogin()">BEJELENTKEZÉS</button>
                <div class="status-text" id="login-status-msg" style="text-align: center;"></div>
            </div>
        </div>

        <!-- 2. JÁTÉKOS FŐMENÜ NÉZET -->
        <div id="launch-section">
            <div class="sidebar">
                <div class="sidebar-top">
                    <div class="user-profile">
                        <div class="user-profile-left">
                            <div class="user-identity-container">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <canvas id="user-head-canvas" class="user-head-icon" width="32" height="32"></canvas>
                                    <span class="user-name" id="display-username">Játékos</span>
                                </div>
                                <img id="user-rank-img" class="user-rank-img" src="" alt="" style="display: none;" />
                            </div>
                        </div>
                        <button class="logout-btn" onclick="handleLogout()" title="Kijelentkezés">
                            <i class="ti ti-logout"></i>
                        </button>
                    </div>

                    <button class="menu-item active" data-target="page-home">
                        <i class="ti ti-home"></i> Főoldal
                    </button>
                    <button class="menu-item" data-target="page-settings">
                        <i class="ti ti-settings"></i> Beállítások
                    </button>
                    <button class="menu-item" data-target="mods-view">
                        <i class="ti ti-puzzle"></i> Modok
                    </button>
                </div>
            </div>

            <!-- FŐOLDAL ALOLDAL -->
            <div id="page-home" class="page-view active">
                <div class="launcher-content">
                    <div class="home-inner">
                        <img src="https://center.astrallegacy.hu/center/ranks/logo.png" alt="Astral Legacy" class="game-logo-img">

                        <div class="play-section">
                            <div class="play-subtitle">Játssz élvezettel!</div>
                            <button class="play-btn" id="playBtn" onclick="handleLaunch()">JÁTÉK INDÍTÁSA</button>
                            <div class="status-text" id="launch-status-msg"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- BEÁLLÍTÁSOK ALOLDAL -->
            <div id="page-settings" class="page-view">
                <div class="launcher-content">
                    <div class="content-card-view">
                        <div class="panel-box">
                            <div style="font-size: 15px; font-weight: 600; text-align: center;">Launcher Beállítások</div>
                            <div class="setting-group">
                                <div class="setting-label">
                                    Memória kiosztás (RAM)
                                    <span id="ram-display-val">4 GB</span>
                                </div>
                                <div class="ram-slider-container">
                                    <span style="font-size: 11px; color: var(--text-muted);">2 GB</span>
                                    <input type="range" id="ram-slider" min="2" max="16" value="4" step="1" oninput="updateRamValue(this.value)">
                                    <span id="ram-max-label" style="font-size: 11px; color: var(--text-muted);">16 GB</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MODOK ALOLDAL -->
            <div id="mods-view" class="page-view">
                <div class="launcher-content">
                    <div class="content-card-view">
                        <div class="mods-panel-box">
                            <div class="mods-header">
                                <h2 style="font-size: 15px; font-weight: 600; color: var(--text-main);">Szerver Modok</h2>
                            </div>
                            
                            <div class="mods-search-container">
                                <input type="text" id="mod-search-input" placeholder="Keresés...">
                            </div>

                            <div id="mods-grid" class="mods-grid">
                                <!-- Dinamikusan betöltött modok -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let activeUsername = '';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const totalMemMB = await ipcRenderer.invoke('get-system-memory');
                const totalMemGB = Math.floor(totalMemMB / 1024);
                const slider = document.getElementById('ram-slider');
                slider.max = totalMemGB;
                document.getElementById('ram-max-label').innerText = totalMemGB + ' GB';

                const savedRam = localStorage.getItem('astral_allocated_ram');
                if (savedRam) slider.value = Math.min(parseInt(savedRam), totalMemGB);
                updateRamValue(slider.value);
            } catch (err) {}

            const savedUser = localStorage.getItem('astral_saved_username');
            const savedPass = localStorage.getItem('astral_saved_password');
            const savedRemember = localStorage.getItem('astral_remember_checked') === 'true';

            if (savedUser) document.getElementById('username').value = savedUser;
            if (savedPass) document.getElementById('password').value = savedPass;
            document.getElementById('remember-user').checked = savedRemember;

            if (savedRemember && savedUser && savedPass) {
                try {
                    const result = await ipcRenderer.invoke('login-user', { username: savedUser, password: savedPass });
                    if (result.success) setLoggedInUser(savedUser);
                } catch (err) {}
            }
        });

        function setLoggedInUser(username) {
            activeUsername = username;
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('launch-section').style.display = 'block';
            document.getElementById('display-username').innerText = username;
            loadUserData(username);
        }

        async function loadUserData(username) {
            const skinUrl = `https://center.astrallegacy.hu/center/minecraft/skins/${encodeURIComponent(username)}.png`;
            drawHeadIcon(skinUrl);

            try {
                const userData = await ipcRenderer.invoke('get-user-data', username);
                if (userData && userData.hasRankImage && userData.rankImageUrl) {
                    const rankImg = document.getElementById('user-rank-img');
                    rankImg.src = userData.rankImageUrl;
                    rankImg.style.display = 'block';
                }
            } catch (err) {
                console.error('Hiba a rang betöltésekor:', err);
            }
        }

        function drawHeadIcon(skinUrl) {
            const canvas = document.getElementById('user-head-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 8, 8, 8, 8, 0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 40, 8, 8, 8, 0, 0, canvas.width, canvas.height);
            };
            img.src = skinUrl;
        }

        function updateRamValue(val) {
            document.getElementById('ram-display-val').innerText = val + ' GB';
            localStorage.setItem('astral_allocated_ram', val);
        }

        document.querySelectorAll('.menu-item').forEach(button => {
            button.addEventListener('click', () => {
                const targetViewId = button.getAttribute('data-target');
                document.querySelectorAll('.menu-item').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.page-view').forEach(page => page.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(targetViewId).classList.add('active');

                if (targetViewId === 'mods-view') {
                    loadModsList();
                }
            });
        });

        async function loadModsList() {
            const grid = document.getElementById('mods-grid');
            if (!grid) return;

            grid.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; grid-column: span 2; text-align: center; padding: 20px;">Modok betöltése...</p>';
            const mods = await ipcRenderer.invoke('get-mods');
            grid.innerHTML = '';

            if (mods.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); font-size: 13px; grid-column: span 2; text-align: center; padding: 20px;">Nincsenek elérhető modok.</p>';
                return;
            }

            mods.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'mod-card';
                card.innerHTML = `
                    <div class="mod-card-top">
                        <span class="mod-title">${mod.name}</span>
                        <label class="switch">
                            <input type="checkbox" ${mod.enabled ? 'checked' : ''} data-filename="${mod.fileName}">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <span class="mod-desc">${mod.desc}</span>
                `;

                const checkbox = card.querySelector('input');
                checkbox.addEventListener('change', async (e) => {
                    const enable = e.target.checked;
                    const res = await ipcRenderer.invoke('toggle-mod', { 
                        fileName: mod.fileName, 
                        enable: enable 
                    });
                    if (!res.success) {
                        alert('Hiba történt: ' + res.error);
                        e.target.checked = !enable;
                    }
                });

                grid.appendChild(card);
            });
        }

        document.getElementById('mod-search-input')?.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.mod-card').forEach(card => {
                const title = card.querySelector('.mod-title').textContent.toLowerCase();
                card.style.display = title.includes(term) ? 'flex' : 'none';
            });
        });

        function minimizeWindow() { ipcRenderer.send('window-minimize'); }
        function closeWindow() { ipcRenderer.send('window-close'); }

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember-user').checked;
            const statusMsg = document.getElementById('login-status-msg');

            if (!username || !password) {
                statusMsg.innerText = 'Töltsd ki az összes mezőt!';
                return;
            }

            const result = await ipcRenderer.invoke('login-user', { username, password });
            if (result.success) {
                localStorage.setItem('astral_remember_checked', remember);
                if (remember) {
                    localStorage.setItem('astral_saved_username', username);
                    localStorage.setItem('astral_saved_password', password);
                }
                setLoggedInUser(username);
            } else {
                statusMsg.innerText = result.message || 'Hibás adatok!';
            }
        }

        function handleLaunch() {
            const playBtn = document.getElementById('playBtn');
            const statusMsg = document.getElementById('launch-status-msg');
            playBtn.innerText = 'JÁTÉK INDÍTÁSA...';
            playBtn.disabled = true;
            statusMsg.innerText = 'Indítás folyamatban...';

            const allocatedRam = document.getElementById('ram-slider').value;
            ipcRenderer.send('launch-game', { username: activeUsername, allocatedRam });
        }

        function handleLogout() {
            document.getElementById('launch-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'flex';
        }

        ipcRenderer.on('launch-error', (event, message) => {
            const playBtn = document.getElementById('playBtn');
            playBtn.innerText = 'JÁTÉK INDÍTÁSA';
            playBtn.disabled = false;
            document.getElementById('launch-status-msg').innerText = message;
        });

        ipcRenderer.on('launch-success', (event, message) => {
            const playBtn = document.getElementById('playBtn');
            playBtn.innerText = 'FUT A JÁTÉK';
            document.getElementById('launch-status-msg').style.color = '#22c55e';
            document.getElementById('launch-status-msg').innerText = message;
        });
    </script>
</body>
</html>
