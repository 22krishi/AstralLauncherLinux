name: Build Linux Launcher

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repository letöltése
      uses: actions/checkout@v4

    - name: Node.js beállítása
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Függőségek telepítése és Linux Build
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN  }}
      run: |
        npm install
        npx electron-builder --linux --publish never

    - name: Elkészült fájlok feltöltése (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: dist/*.AppImage
